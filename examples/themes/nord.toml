# butai theme — nord
#
# The `nord` built-in, written out in full. You do not need this file to use
# the theme — `[theme] name = "nord"` is enough — it is here to copy when you
# want to change two things about it:
#
#   cp nord.toml ~/.butai/themes/mynord.toml
#   then `:theme mynord` in butai.
#
# Arctic blue-greys: Polar Night for the grounds, Frost for the accent, Aurora
# for state. Two values are not Nord's own, and both are noted below.

name = "nord"

[colors]
# Surfaces — Polar Night. `sunken` has to sit below nord0, which is already the
# darkest tone Nord defines, or the tab strip is indistinguishable from the
# ground; this is nord0 taken down.
ground        = "#2e3440"  # nord0
surface       = "#3b4252"  # nord1: help, pickers
sunken        = "#272c36"  # below nord0
selection     = "#434c5e"  # nord2
selection_dim = "#3b4252"  # nord1

# Text — Snow Storm. `faint` is not nord3: nord-vim added #616e88 for comments
# after nord3 on nord0 turned out too low-contrast to read, which is the job
# this role does here.
ink       = "#eceff4"  # nord6
muted     = "#d8dee9"  # nord4
faint     = "#616e88"  # nord3, lightened
on_accent = "#2e3440"  # nord0, so it reads on the light accent fill

# Lines
rule       = "#4c566a"  # nord3
rule_focus = "#88c0d0"  # nord8

# State — Frost for the accent, Aurora for the rest
accent    = "#88c0d0"  # nord8, frost
info      = "#81a1c1"  # nord9, frost
ok        = "#a3be8c"  # nord14, aurora green
attention = "#ebcb8b"  # nord13, aurora yellow
danger    = "#bf616a"  # nord11, aurora red

# Footer
status_bg = "#3b4252"  # nord1
status_fg = "#d8dee9"  # nord4
