name: Release

# Tagging `vX.Y.Z` builds the `butai` binary for every supported target and
# publishes one tarball per target, plus a SHA256SUMS file, to the GitHub
# release that scripts/install.sh reads.
#
# There are two tracks, and one workflow serves both because the artifacts are
# identical — only how the release is *labelled* differs:
#
#   v1.3.0        cut on `main`     a stable release
#   v1.3.0-dev.1  cut on `develop`  a prerelease
#
# A tag with a `-` in it is the dev track, published with `--prerelease`. That
# one flag is the whole separation, and it is load-bearing on both ends:
# GitHub keeps a prerelease out of `releases/latest`, which is the endpoint
# `crates/butai-update` asks and `scripts/install.sh` reads — so a dev tag is
# invisible to every stable install without either of them filtering anything.
# Reaching one is deliberate: `BUTAI_VERSION=v1.3.0-dev.1`.
#
# `workflow_dispatch` builds the same matrix without publishing, which is how
# you prove the matrix still compiles before cutting a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # One broken target should not hide the state of the other six.
      fail-fast: false
      matrix:
        include:
          # Linux, dynamically linked against glibc. `cross` builds these in a
          # container with an old glibc, which sets the compatibility floor —
          # building on the runner's own glibc would raise it to the runner's.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            cross: true

          # Linux, statically linked. Runs on Alpine, distroless and scratch,
          # and on any glibc too old for the builds above.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true

          # macOS builds natively on each arch. That is deliberate: the linker
          # ad-hoc signs the binary as a side effect, and arm64 macOS refuses to
          # exec an unsigned one ("Killed: 9"). Cross-compiling darwin from
          # Linux would need a separate signing step to produce a runnable
          # binary at all.
          - target: aarch64-apple-darwin
            os: macos-14
            cross: false
          # Built on the arm64 runner too: either Mac links both Apple arches,
          # and the macos-13 Intel pool queues for far longer than the build
          # takes. Still natively ad-hoc signed, since the host is macOS.
          - target: x86_64-apple-darwin
            os: macos-14
            cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Build
        run: |
          builder=cargo
          if [ "${{ matrix.cross }}" = "true" ]; then builder=cross; fi
          "$builder" build --release --target ${{ matrix.target }} -p butai

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # workflow_dispatch has no tag to read a version from.
          case "$GITHUB_REF_NAME" in
            v*) ;;
            *) version="$(cargo metadata --no-deps --format-version 1 \
                  | grep -o '"name":"butai","version":"[^"]*"' \
                  | head -n1 | sed 's/.*"version":"\([^"]*\)".*/\1/')" ;;
          esac

          stage="butai-$version-${{ matrix.target }}"
          mkdir -p "dist/$stage"
          cp "target/${{ matrix.target }}/release/butai" "dist/$stage/"
          cp README.md LICENSE "dist/$stage/"
          tar -C dist -czf "dist/$stage.tar.gz" "$stage"
          rm -rf "dist/$stage"
          echo "tarball=$stage.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the binary
        # Only where the runner can actually execute what we just built. This
        # catches a binary that links but dies on startup — the failure mode an
        # unsigned or mis-linked artifact produces.
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-apple-darwin'
        run: ./target/${{ matrix.target }}/release/butai --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ steps.package.outputs.tarball }}
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    # Only a tag publishes. A dispatch run stops after proving the matrix builds.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      # For CHANGELOG.md. The job otherwise needs no source, but the release
      # notes are the changelog's section for this tag rather than a generated
      # commit list: the entry says what changed and why, which a list of
      # subject lines does not.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksum
        run: |
          cd dist
          sha256sum ./*.tar.gz | sed 's| \./| |' > SHA256SUMS
          cat SHA256SUMS

      # Which track is this? A prerelease identifier — the `-` in
      # `1.3.0-dev.1`, as semver defines it — is the only thing that says so.
      # The branch does not: a tag is a commit, and by the time this job runs
      # there is nothing to ask about where it was cut.
      - name: Classify the tag
        id: track
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "::notice::$GITHUB_REF_NAME is a $([ "$prerelease" = true ] && echo dev prerelease || echo stable release)"

      # The changelog's own section for this tag, verbatim. `awk` rather than a
      # markdown tool: the heading shape is fixed by Keep a Changelog, and the
      # section is everything between this version's heading and the next one.
      #
      # A dev tag reads `## [Unreleased]` instead, and does not fail when it is
      # thin. The two tracks are asking different questions: a stable release
      # is an announcement, and shipping one whose changes nobody wrote down is
      # a mistake worth stopping for. A dev tag is a build you cut to try
      # something — the notes are a convenience, and failing the publish over
      # them would only mean the binaries you wanted never got built.
      - name: Release notes from the changelog
        run: |
          set -euo pipefail
          version="${{ steps.track.outputs.version }}"
          heading="## [$version]"
          if [ "${{ steps.track.outputs.prerelease }}" = "true" ]; then
            heading="## [Unreleased]"
          fi
          awk -v v="$heading" '
            index($0, v) == 1 { found = 1; next }
            found && /^## \[/  { exit }
            found             { print }
          ' CHANGELOG.md > notes.md

          if [ "${{ steps.track.outputs.prerelease }}" = "true" ]; then
            if [ ! -s notes.md ]; then
              echo "_Cut from \`develop\`; see the commit log._" > notes.md
            fi
            {
              echo
              echo "---"
              echo
              echo "**This is a development build, not a stable release.** It is"
              echo "not offered to anyone by \`butai update\`, and \`install.sh\`"
              echo "will not find it on its own. To install it deliberately:"
              echo
              echo "\`\`\`sh"
              echo "BUTAI_VERSION=$GITHUB_REF_NAME curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts/install.sh | sh"
              echo "\`\`\`"
              echo
              echo "Checksums are in \`SHA256SUMS\`; the installer verifies them."
            } >> notes.md
          else
            # A stable tag with no entry is a mistake worth failing on: it means
            # the changelog was not updated for a release that is about to ship.
            if [ ! -s notes.md ]; then
              echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME"
              exit 1
            fi
            {
              echo
              echo "---"
              echo
              echo "Install: \`curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts/install.sh | sh\`"
              echo
              echo "Checksums are in \`SHA256SUMS\`; the installer verifies them."
            } >> notes.md
          fi
          echo "--- notes.md ---"; cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          if [ "${{ steps.track.outputs.prerelease }}" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            "${flags[@]}" \
            dist/*.tar.gz dist/SHA256SUMS
