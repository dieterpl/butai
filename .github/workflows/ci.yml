name: CI

on:
  push:
    # `develop` is where feature branches land and where dev tags are cut from,
    # so it gets the same gate `main` does. Feature branches themselves are
    # covered by `pull_request` below, which has no branch filter.
    branches: [main, develop]
  pull_request:
  schedule:
    # Nightly soak, and the only scheduled run that exercises the real agent
    # CLIs — the one thing that catches an upstream status-line reword.
    - cron: "0 3 * * *"
  # Lets the nightly-only jobs (the release-target check) be run on demand.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: rust (fmt, clippy, test)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup show && rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --all --all-features

      # The step above already regenerated the browser client's TypeScript:
      # `--all-features` turns on `butai-protocol`'s `ts` feature, whose export
      # tests write `web/src/protocol/generated/`. So proving the checked-in
      # bindings are current costs one `git diff` rather than a second build.
      #
      # This is the whole point of generating them. A DTO that gains a field and
      # a client that never learned about it is the drift the old hand-written
      # JS could not detect; here it is a red CI step naming the exact line.
      # The fix is never to edit the generated file — it is to run
      # `cargo test -p butai-protocol --features ts` and commit what it writes.
      - name: TypeScript bindings are current
        run: |
          git diff --exit-code --stat web/src/protocol/generated/ || {
            echo "::error::The generated TypeScript is stale. Run:"
            echo "::error::  cargo test -p butai-protocol --features ts"
            echo "::error::and commit web/src/protocol/generated/."
            exit 1
          }

  windows:
    name: Windows native TUI and daemon
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: rustup show && rustup component add clippy
      - name: Build
        run: cargo build --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features
      - name: IPC tests
        run: cargo test -p butai-protocol --all-features
      - name: Font compatibility and native console rendering
        run: |
          cargo test -p butai-client glyphs::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p butai-client --test windows_console
      - name: ConPTY and daemon smoke test
        run: cargo test -p butai-server --test e2e_windows
      - name: Windows executable lookup
        run: cargo test -p butai-server windows_resolve_tests
      - name: Native workspace search
        run: cargo test -p butai-server search::tests
      - name: Native system telemetry
        run: cargo test -p butai-server sys::tests::cpu_and_ram_readable -- --exact
      - name: CLI smoke test
        shell: pwsh
        run: |
          $env:BUTAI_HOME = Join-Path $env:RUNNER_TEMP "butai-smoke"
          try {
            & ./target/debug/butai.exe ws create --cwd $env:GITHUB_WORKSPACE
            if ($LASTEXITCODE -ne 0) { throw "daemon auto-start failed" }
            & ./target/debug/butai.exe --json ws ls
            if ($LASTEXITCODE -ne 0) { throw "workspace query failed" }
          } finally {
            & ./target/debug/butai.exe kill-server --clear
          }
      - name: Build Windows beta artifact
        env:
          RUSTFLAGS: '-D warnings -C target-feature=+crt-static'
        shell: pwsh
        run: |
          cargo build --release --locked -p butai
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = & ./target/release/butai.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist/windows-beta | Out-Null
          Copy-Item target/release/butai.exe, LICENSE, docs/windows.md dist/windows-beta/
          $version | Set-Content dist/windows-beta/VERSION.txt
          $hash = (Get-FileHash dist/windows-beta/butai.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  butai.exe" | Set-Content dist/windows-beta/SHA256SUMS -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: butai-windows-beta-${{ github.sha }}
          path: dist/windows-beta/
          if-no-files-found: error

  targets:
    # The release matrix rots quietly: a dependency picks up a C library, or a
    # cfg gate assumes glibc, and nobody finds out until a tag is cut. This
    # type-checks every published target nightly so the break surfaces within a
    # day instead of at release time. `check`, not `build` — the point is to
    # catch a target that stopped compiling, and a full link of seven targets
    # is not worth the runner time.
    name: release targets still compile
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, cross: true }
          - { target: armv7-unknown-linux-gnueabihf, os: ubuntu-latest, cross: true }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: aarch64-apple-darwin, os: macos-14, cross: false }
          - { target: x86_64-apple-darwin, os: macos-14, cross: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, cross: false }
    steps:
      - uses: actions/checkout@v4
      - run: rustup show && rustup target add ${{ matrix.target }}
      - if: matrix.cross
        run: cargo install cross --locked
      - name: Check
        shell: bash
        run: |
          builder=cargo
          if [ "${{ matrix.cross }}" = "true" ]; then builder=cross; fi
          "$builder" check --release --target ${{ matrix.target }} -p butai

  web:
    # The client is TypeScript with a build step now, so the compiler is the
    # first check and it is a real one: the DTOs it checks against are generated
    # from `butai-protocol` by ts-rs, so a daemon field a client never learned
    # about fails here rather than surfacing as a value silently ignored in a
    # browser.
    #
    # This replaces `check.py --static-only`, which existed because nothing read
    # `web/`'s code until a browser did — a module that failed to parse was one
    # console line and a blank page. `tsc` reads all of it in under a second, and
    # `bun run build` proves it also links.
    #
    # Independent of the `rust` job for the same reason it always was: a lint
    # failure elsewhere must not hide a client nobody can load.
    name: web client (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `--frozen-lockfile`, so CI installs what the repo pins rather than
      # whatever resolves today. The image build asserts the same thing.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

  integration:
    # The one web test that needs a real daemon. It lives here rather than in
    # the `web` job because that job is bun-only by design, and a test that
    # spawns `butai` cannot pass without something having built it.
    #
    # Left in `web`, it read `BUTAI_BIN` with a hardcoded fallback and so was
    # green on a box where a stale binary happened to sit at that path and red
    # on every clean one. Building it here is what makes the test mean anything:
    # it is the current tree's daemon the relay is proved against, not whatever
    # was lying around.
    name: integration (web relay against a real daemon)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Debug, not release: this proves the relay's framing, and an optimised
      # build buys nothing but runner minutes.
      - name: Build the daemon
        run: cargo build -p butai

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Relay tests
        working-directory: web
        env:
          BUTAI_BIN: ${{ github.workspace }}/target/debug/butai
        run: bun test test/ws.test.ts

  docker:
    # Independent of the `rust` job on purpose. This suite proves the daemon's
    # public API from outside, the way `web/` does, and gating it behind fmt or
    # clippy would mean a lint failure hides an API regression.
    name: docker testsuite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Choose a profile
        id: profile
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "name=soak" >> "$GITHUB_OUTPUT"
            echo "args=--minutes 25" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "name=smoke" >> "$GITHUB_OUTPUT"
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "name=standard" >> "$GITHUB_OUTPUT"
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the suite
        run: ./testsuite/run.sh ${{ steps.profile.outputs.name }} ${{ steps.profile.outputs.args }}

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testsuite-${{ steps.profile.outputs.name }}
          path: testsuite/out/
          if-no-files-found: warn
